name: release

# On every push to main: typecheck + test, then (if NPM_TOKEN is set) bump the
# patch version, tag it, push the bump back, and publish to npm. The bump commit
# carries [skip ci] so it never re-triggers this workflow.
#
# Setup required once: add a repo secret NPM_TOKEN (npm > Access Tokens >
# Automation token). Without it, this workflow still runs as CI (typecheck +
# tests) but skips the version bump and publish.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: bun install

      - run: bun run typecheck

      - run: bun test

      - run: bun run build

      - name: Bump version, tag, push and publish
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore(release): v%s [skip ci]"
          git push --follow-tags
          npm publish --access public
