name: release

# Every push to main runs typecheck + tests. Publishing only happens when this
# workflow is started explicitly with workflow_dispatch; that run bumps the
# patch version, tags it, pushes the bump, and publishes it to npm.
#
# Setup required once: add a repo secret NPM_TOKEN (npm > Access Tokens >
# Automation token). Without it, this workflow still runs as CI (typecheck +
# tests) but skips the version bump and publish.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: bun install

      - run: bun run typecheck

      - run: bun test

      - run: bun run build

      - name: Bump version, tag, push and publish
        if: ${{ github.event_name == 'workflow_dispatch' && env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          # `bun install` can rewrite bun.lock; discard that drift so the tree is
          # clean and `npm version` (which refuses a dirty tree) can run.
          git checkout -- bun.lock 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore(release): v%s [skip ci]"
          git push --follow-tags
          npm publish --access public
