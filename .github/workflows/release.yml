name: release

# CI: every push to main and every pull request runs `bun run check`, which
# typechecks, tests and builds both packages (1.x at the root and
# opencode-profile-switcher-v2 in packages/v2).
#
# Publishing only happens when this workflow is started explicitly with
# workflow_dispatch from main. That run bumps the version of ONE package, tags
# it, pushes the bump, and publishes that package to npm. The other package is
# not bumped, tagged or published.
#
# Two inputs:
#
#   package — which package to release.
#     v1 — `opencode-profile-switcher` (repo root), for opencode 1.x.
#     v2 — `opencode-profile-switcher-v2` (packages/v2), for opencode 2.x.
#
#   channel — which npm dist-tag to publish to. Anything other than `latest`
#   or `next` fails before bumping (empty means `latest`).
#     latest — a patch bump (0.1.7 -> 0.1.8) published to the `latest` dist-tag.
#              This is what users installing the plugin normally get.
#     next   — a prerelease bump (0.1.7 -> 0.1.8-next.0) published to the `next`
#              dist-tag only. Once the package exists on npm, `latest` keeps
#              pointing at the last stable release, so normal installs are
#              untouched. Use it to try the published package before a stable
#              release. For 1.x this is also the only way to exercise the TUI
#              half: opencode 1.x loads `./tui` only from a published package.
#              The v2 TUI can already be loaded from a local `dist` (see
#              docs/testing-v2.md).
#
# First publish of a package: a package that is not on npm yet has no stable
# release for `next` to leave `latest` on, so its first publish must use
# `channel=latest`; `next` fails before bumping. Every run bumps before
# publishing, so the first v2 release will be 0.1.1 (0.1.0 is never published):
#
#   gh workflow run release.yml -f package=v2 -f channel=latest
#
# Git tags differ per package so they never collide:
#   v1 — `v<version>` (e.g. `v0.1.9`), the scheme used since the first release.
#   v2 — `opencode-profile-switcher-v2@<version>` (e.g.
#        `opencode-profile-switcher-v2@0.1.1`): the npm package name plus the
#        version, so the tag says which package it belongs to and can never be
#        mistaken for a 1.x `v*` tag.
#
# The release commit and tag are pushed before `npm publish`, so a failed push
# never publishes. If the push succeeds and `npm publish` fails, the commit and
# tag stay on main without a package on npm. Do NOT dispatch again: that would
# bump to the next version and skip this one. Publish the tagged version by
# hand instead; the failed run prints the exact commands. In short:
#
#   git fetch --tags && git checkout <tag>
#   bun install
#   cd <package dir> && npm publish --access public [--tag next]
#
# Authentication: trusted publishing (OIDC) first, NPM_TOKEN as a fallback.
# The publish job has `id-token: write` and runs npm >= 11.5.1, so `npm
# publish` exchanges a GitHub OIDC token for a short-lived npm token, with no
# stored secret, and npm attaches provenance on its own (public repo, public
# package; no --provenance flag needed). Before bumping, the run tries that
# exchange for the chosen package:
#   - it works: the publish uses OIDC.
#   - it fails and the repo secret NPM_TOKEN is set: the publish uses the
#     token (no provenance), and the run says so with a warning.
#   - it fails and there is no NPM_TOKEN: the run fails before bumping.
# Trusted publishers can only be added to a package that is already on npm, so
# a package's first publish needs NPM_TOKEN (or is done by hand).
#
# Setup required once per package, on npmjs.com (Packages > <package> >
# Settings > Trusted publishing > GitHub Actions), for opencode-profile-switcher
# and opencode-profile-switcher-v2:
#   Organization or user: GinoNovello
#   Repository:           opencode-profile-switcher
#   Workflow filename:    release.yml
#   Environment name:     (empty; this job uses no GitHub environment)
#   Allowed actions:      npm publish (new configurations only allow
#                         `npm stage publish` unless this is enabled)
# The fields are case-sensitive and npm only checks them at publish time. A new
# configuration expires if it has no successful publish within 2 days, so add
# it right before dispatching. If this file is renamed, the trusted publishers
# must be recreated with the new name. NPM_TOKEN can be removed once a publish
# through OIDC has worked for both packages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (v1 = opencode-profile-switcher, v2 = opencode-profile-switcher-v2)"
        type: choice
        options: [v1, v2]
        default: v1
      channel:
        description: "npm dist-tag to publish to (a package's first publish must be latest)"
        type: choice
        options: [latest, next]
        default: latest

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      # 1.x: typecheck, test, build. v2: typecheck, test, build.
      - run: bun run check

  publish:
    needs: check
    # Only an explicit dispatch from main publishes; a dispatch from any other
    # branch would ship unreviewed code.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      # Lets npm request the GitHub OIDC token for trusted publishing. It only
      # allows fetching that token; it grants no write access to anything.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0. Node
          # 24.21.0 ships npm 11.19.0; an exact version keeps the npm used to
          # publish fixed instead of whatever the latest 24.x bundles.
          node-version: 24.21.0
          # Writes an .npmrc that reads NODE_AUTH_TOKEN, used only when
          # NPM_TOKEN is the fallback. A successful OIDC exchange overrides it.
          registry-url: https://registry.npmjs.org

      - run: bun install

      - name: Bump version, tag, push and publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          case "$CHANNEL" in
            "" | latest)
              CHANNEL=latest
              BUMP=(patch)
              PUBLISH=(--access public)
              ;;
            next)
              # 0.1.7 -> 0.1.8-next.0, and a second run -> 0.1.8-next.1.
              BUMP=(prerelease --preid next)
              # --tag next leaves the `latest` dist-tag where it is, so a plain
              # `npm i <package>` is unaffected (see the first-publish check).
              PUBLISH=(--access public --tag next)
              ;;
            *)
              echo "::error::Unknown channel '$CHANNEL' (expected latest or next); nothing was bumped or published."
              exit 1
              ;;
          esac

          case "$PACKAGE" in
            v1)
              NAME=opencode-profile-switcher
              DIR=.
              ;;
            v2)
              NAME=opencode-profile-switcher-v2
              DIR=packages/v2
              ;;
            *)
              echo "::error::Unknown package '$PACKAGE' (expected v1 or v2); nothing was bumped or published."
              exit 1
              ;;
          esac

          NPM_VERSION=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$NPM_VERSION" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm $NPM_VERSION is older than 11.5.1, which trusted publishing needs; nothing was bumped or published."
            exit 1
          fi

          # Try the same OIDC exchange `npm publish` will do, so a package
          # without a trusted publisher is caught before bumping. The tokens
          # never reach the shell or the log; only the outcome is printed.
          # shellcheck disable=SC2016 # JS source, not shell expansions.
          if REASON=$(node --input-type=module -e '
            const name = process.argv[1]
            const { ACTIONS_ID_TOKEN_REQUEST_URL: requestUrl, ACTIONS_ID_TOKEN_REQUEST_TOKEN: requestToken } = process.env
            const fail = (message) => {
              console.log(message)
              process.exit(1)
            }
            if (!requestUrl || !requestToken) fail("no GitHub OIDC token available (is id-token: write set?)")
            const url = new URL(requestUrl)
            url.searchParams.append("audience", "npm:registry.npmjs.org")
            const id = await fetch(url, { headers: { Authorization: `Bearer ${requestToken}` } })
              .catch((error) => fail(`could not request the GitHub OIDC token (${error.message})`))
            if (!id.ok) fail(`GitHub refused the OIDC token request (HTTP ${id.status})`)
            const { value } = await id.json()
            if (!value) fail("GitHub returned no OIDC token")
            const exchange = await fetch(
              `https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name.replace("/", "%2f")}`,
              { method: "POST", headers: { Authorization: `Bearer ${value}` } },
            ).catch((error) => fail(`could not reach npm for the OIDC exchange (${error.message})`))
            if (!exchange.ok) fail(`npm refused the OIDC exchange for ${name} (HTTP ${exchange.status}); check its trusted publisher on npmjs.com`)
          ' "$NAME"); then
            echo "::notice::Publishing $NAME with trusted publishing (OIDC); npm adds provenance."
          elif [ -n "$NPM_TOKEN" ]; then
            echo "::warning::Trusted publishing is not available for $NAME: $REASON. Falling back to NPM_TOKEN (no provenance)."
          else
            echo "::error::Trusted publishing is not available for $NAME: $REASON. NPM_TOKEN is not set either; nothing was bumped or published."
            exit 1
          fi

          # A package that is not on npm yet has no stable release for `next`
          # to leave `latest` on: its first publish must go to `latest`. Only a
          # 404 means "not published yet"; any other registry error stops here.
          if ! VIEW=$(npm view "$NAME" version 2>&1); then
            if ! grep -q "E404" <<<"$VIEW"; then
              echo "$VIEW"
              echo "::error::Could not query npm for $NAME; nothing was bumped or published."
              exit 1
            fi
            if [ "$CHANNEL" = "next" ]; then
              echo "::error::$NAME is not on npm yet. Its first publish must use channel=latest; nothing was bumped or published."
              exit 1
            fi
            echo "::notice::$NAME is not on npm yet; this run is its first publish."
          fi

          # `bun install` can rewrite bun.lock; discard that drift so the tree is
          # clean and `npm version` (which refuses a dirty tree) can run.
          git checkout -- bun.lock 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          case "$PACKAGE" in
            v1)
              # The root is the git root, so `npm version` commits and tags
              # `v<version>` itself. It only touches the root package.json.
              npm version "${BUMP[@]}" -m "chore(release): v%s [skip ci]"
              VERSION=$(node -p 'require("./package.json").version')
              TAG="v$VERSION"
              ;;
            v2)
              cd packages/v2
              # Bump only the manifest; the commit and the per-package tag are
              # made below. --no-workspaces-update keeps npm from running an
              # install over the bun workspace.
              npm version "${BUMP[@]}" --no-git-tag-version --no-workspaces-update
              VERSION=$(node -p 'require("./package.json").version')
              TAG="opencode-profile-switcher-v2@$VERSION"
              # bun.lock records the workspace version; update just that line
              # instead of re-running `bun install`, which could add the drift
              # discarded above to the release commit. The lock must hold
              # exactly one v2 version before and after, and it must be the
              # new one; otherwise stop before committing.
              # shellcheck disable=SC2016 # JS source, not shell expansions.
              node -e '
                const fs = require("fs")
                const file = "../../bun.lock"
                const version = process.argv[1]
                const re = /("name": "opencode-profile-switcher-v2",\s*"version": ")([^"]*)(")/g
                const versions = (text) => [...text.matchAll(re)].map((match) => match[2])
                const fail = (message) => {
                  console.error(`::error::${message}; nothing was committed or published.`)
                  process.exit(1)
                }
                const before = versions(fs.readFileSync(file, "utf8"))
                if (before.length !== 1) {
                  fail(`expected one v2 workspace version in bun.lock, found ${before.length}`)
                }
                fs.writeFileSync(file, fs.readFileSync(file, "utf8").replace(re, `$1${version}$3`))
                const after = versions(fs.readFileSync(file, "utf8"))
                if (after.length !== 1 || after[0] !== version) {
                  fail(`bun.lock v2 workspace version is ${after.join(", ")}, expected ${version}`)
                }
              ' "$VERSION"
              git add package.json ../../bun.lock
              git commit -m "chore(release): $TAG [skip ci]"
              git tag -a "$TAG" -m "$TAG"
              cd ../..
              ;;
          esac

          git push --follow-tags

          if ! (cd "$DIR" && npm publish "${PUBLISH[@]}"); then
            echo "::error::$TAG was pushed to main but npm publish of $NAME@$VERSION failed. Do not dispatch again (it would skip $VERSION); publish $TAG by hand as shown in the log."
            echo "To publish $NAME@$VERSION from the tagged commit, logged in to npm (npm login) as a maintainer of $NAME:"
            echo "  git fetch --tags && git checkout '$TAG'"
            echo "  bun install"
            if [ "$DIR" != "." ]; then echo "  cd $DIR"; fi
            echo "  npm publish ${PUBLISH[*]}"
            exit 1
          fi
